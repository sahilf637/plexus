[package]
name = "plexus"
version = "0.1.0"
description = "Copy anything. Your second brain wires itself."
authors = ["Sahil Singh"]
license = "MIT"
repository = "https://github.com/sahilf637/plexus"
edition = "2024"
rust-version = "1.90"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "plexus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["sync", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
regex = "1"
arboard = "3"
png = "0.18"
rusqlite = { version = "0.40", features = ["bundled"] }
sqlite-vec = "0.1"
serde_norway = "0.9"
ulid = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.11"
pulldown-cmark = { version = "0.13", default-features = false }
# Local embeddings: runs the bundled ONNX model. No model downloads at run time.
fastembed = { version = "7", default-features = false }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-rustls"] }
dom_smoothie = "0.18"
ureq = "3"
ocrs = "0.13.1"
rten = { version = "0.26", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
htmd = "0.5.5"
pdf-extract = "0.12.1"
roxmltree = "0.21.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Global shortcuts on Wayland go through the desktop portal.
ashpd = { version = "0.13", features = ["global_shortcuts"] }
# For handing the portal's activation token to the window, so the desktop gives it focus.
gtk = "0.18"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# The OCR and PDF readers are unusably slow unoptimised, so they are optimised in dev builds too.
[profile.dev.package.rten]
opt-level = 3
[profile.dev.package.rten-base]
opt-level = 3
[profile.dev.package.rten-gemm]
opt-level = 3
[profile.dev.package.rten-simd]
opt-level = 3
[profile.dev.package.rten-tensor]
opt-level = 3
[profile.dev.package.rten-vecmath]
opt-level = 3
[profile.dev.package.rten-imageproc]
opt-level = 3
[profile.dev.package.ocrs]
opt-level = 3
[profile.dev.package.image]
opt-level = 3

[package]
name = "plexus"
version = "0.1.0"
description = "Copy anything. Your second brain wires itself."
authors = ["Sahil Singh"]
license = "MIT"
repository = "https://github.com/sahilf637/plexus"
edition = "2024"
rust-version = "1.90"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "plexus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["sync", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
regex = "1"
arboard = "3"
png = "0.18"
rusqlite = { version = "0.40", features = ["bundled"] }
sqlite-vec = "0.1"
serde_norway = "0.9"
ulid = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
# Global shortcuts on Wayland go through the desktop portal.
ashpd = { version = "0.13", features = ["global_shortcuts"] }
# For handing the portal's activation token to the window, so the desktop gives it focus.
gtk = "0.18"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
